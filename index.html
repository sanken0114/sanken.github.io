<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>山田 太郎のプロフィール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef0fb;
    --ink: #15173d;
    --blue: #2f3de0;
    --pink: #ff7aa8;
    --sun: #ffd84a;
    --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12132b;
      --ink: #f1f2ff;
      --blue: #8a93ff;
      --card: #1d1f45;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Meiryo", sans-serif;
    line-height: 1.9;
    font-size: 17px;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 72px 24px 48px;
  }

  .name {
    font-size: clamp(56px, 16vw, 120px);
    font-weight: 900;
    line-height: 1.1;
    margin: 0;
    letter-spacing: -0.02em;
    color: var(--blue);
    text-shadow: 5px 5px 0 var(--sun);
  }
  .tagline {
    display: inline-block;
    margin: 28px 0 0;
    padding: 6px 18px;
    background: var(--ink);
    color: var(--bg);
    border-radius: 999px;
    font-weight: 700;
  }

  section { margin-top: 72px; }
  h2 {
    font-size: 28px;
    font-weight: 900;
    margin: 0 0 20px;
    display: inline-block;
    background: linear-gradient(transparent 62%, var(--pink) 62%);
  }
  p { margin: 0 0 1em; max-width: 36em; }

  .tags { display: flex; flex-wrap: wrap; gap: 12px; padding: 0; margin: 0; list-style: none; }
  .tags li {
    padding: 8px 20px;
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 14px;
    font-weight: 700;
  }
  .tags li:nth-child(3n+1) { border-radius: 999px; }
  .tags li:nth-child(3n+2) { border-radius: 6px; transform: rotate(-2deg); }
  .tags li:nth-child(3n)   { background: var(--sun); color: #15173d; }

  .links { display: flex; flex-wrap: wrap; gap: 14px; }
  .links a {
    display: inline-block;
    padding: 12px 28px;
    background: var(--blue);
    color: #fff;
    font-weight: 700;
    text-decoration: none;
    border: 3px solid var(--ink);
    border-radius: 14px;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform .12s, box-shadow .12s;
  }
  .links a:hover { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .links a:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
  @media (prefers-color-scheme: dark) {
    .links a { color: #12132b; }
  }

  footer { margin-top: 96px; font-size: 14px; opacity: .7; }
  @media (prefers-reduced-motion: reduce) {
    .links a { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1 class="name">三城<br>賢祐</h1>
  <p class="tagline">わあ</p>

  <section>
    <h2>自己紹介</h2>
    <p>三城 賢祐です。</p>
    <p>好きなこととか書くところにする</p>
  </section>

  <section>
    <h2>スキル</h2>
    <ul class="tags">
      <li>waaaaaa</li>
      <li>waaaa</li>
      <li>waa</li>
      <li>wa</li>
      <li>waa</li>
      <li>勉強中のもの</li>
    </ul>
  </section>

  <section>
    <h2>リンク</h2>
    <div class="links">
      <a href="https://github.com/sanken0114">GitHub</a>
      <a href="waaaa">waa</a>
    </div>
  </section>

  <footer> waaa</footer>
</main>
</body>
</html>
