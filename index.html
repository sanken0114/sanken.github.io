<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三城 賢祐のプロフィール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe4;      /* 生成り */
    --ink: #2a2723;     /* 墨 */
    --ai: #1f4e79;      /* 藍 */
    --shu: #c8382b;     /* 朱 */
    --yamabuki: #e0a526;/* 山吹 */
    --line: #cfc6b3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101a28;    /* 藍染 */
      --ink: #eee7d6;
      --ai: #8fb4d9;
      --shu: #e5604f;
      --yamabuki: #e8b64a;
      --line: #34425a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    line-height: 2;
    font-size: 17px;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 28px 48px;
  }

  /* 名前をこのページで一番目立たせる */
  .hero {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(8px, 3vw, 28px);
    min-height: 360px;
    padding-bottom: 56px;
    border-bottom: 1px solid var(--line);
  }
  .name {
    writing-mode: horizontal-tb;
    white-space: nowrap;
    font-size: clamp(28px, 9vw, 72px);
    font-weight: 800;
    letter-spacing: 0.06em;
    line-height: 1.2;
    margin: 0;
    color: var(--ai);
  }
  .portrait {
    display: block;
    width: clamp(96px, 30vw, 220px);
    aspect-ratio: 2 / 3;
    object-fit: cover;
    border-radius: 4px;
  }
  .side {
    writing-mode: vertical-rl;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 24px;
    padding-top: 12px;
  }
  .tagline {
    margin: 0;
    font-size: 18px;
    letter-spacing: 0.3em;
  }
  .hanko {
    writing-mode: horizontal-tb;
    display: grid;
    place-items: center;
    width: 52px;
    height: 52px;
    background: var(--shu);
    color: #fff;
    font-weight: 800;
    font-size: 28px;
    border-radius: 4px;
    transform: rotate(-4deg);
  }

  section { margin-top: 64px; }
  h2 {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 20px;
    padding-left: 14px;
    border-left: 5px solid var(--shu);
    letter-spacing: 0.1em;
  }
  p { margin: 0 0 1em; }

  .tags { display: flex; flex-wrap: wrap; gap: 10px; padding: 0; margin: 0; list-style: none; }
  .tags li {
    padding: 4px 18px;
    border: 1px solid var(--ink);
    border-radius: 2px;
    letter-spacing: 0.08em;
  }
  .tags li:nth-child(3n) { border-color: var(--yamabuki); background: var(--yamabuki); color: #2a2723; }

  .links { display: flex; flex-wrap: wrap; gap: 14px; }
  .links a {
    display: inline-block;
    padding: 10px 32px;
    background: var(--ai);
    color: var(--bg);
    text-decoration: none;
    letter-spacing: 0.15em;
    border-radius: 2px;
    transition: background .2s;
  }
  .links a:hover { background: var(--shu); color: #fff; }
  .links a:focus-visible { outline: 3px solid var(--yamabuki); outline-offset: 3px; }

  footer {
    margin-top: 88px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 14px;
    opacity: .75;
    text-align: center;
  }
  @media (prefers-reduced-motion: reduce) {
    .links a { transition: none; }
  }
</style>
</head>
<body>
<main>
  <header class="hero">
    <h1 class="name">三城 賢祐</h1>
    <img class="portrait" src="profile.jpeg" alt="三城賢祐の写真">
  </header>

  <section>
    <h2>自己紹介</h2>
    <p>三城賢祐です。</p>
    <p>好きなこととか書くところ。</p>
  </section>

  <section>
    <h2>スキル</h2>
    <ul class="tags">
      <li>wa</li>
      <li>waa</li>
      <li>waaa</li>
      <li>waaaa</li>
      <li>GitHub</li>
      <li>勉強中のもの</li>
    </ul>
  </section>

  <section>
    <h2>リンク</h2>
    <div class="links">
      <a href="https://github.com/sanken0114">GitHub</a>
      <a href="waa">waaa</a>
    </div>
  </section>

  <footer>© 2026 三城 賢祐</footer>
</main>
</body>
</html>
